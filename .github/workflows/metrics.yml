name: metrics

on:
  schedule:
    # 06:17 UTC (01:17 Bogotá). Minuto no-cero a propósito: los schedule en :00
    # son los que más se retrasan o se saltan por carga.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write      # para avisar cuando falle

# Sin esto, el cron y un dispatch manual simultáneos hacen que el segundo push
# muera con non-fast-forward.
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # lo pide el `pull --rebase` del reintento

      - name: Consultar la API y reescribir el README
        env:
          # CONTRIBUCIONES: PAT clásico, scope `read:user` ÚNICAMENTE (+ read:org si
          #   la prueba lo exige). No da acceso a código.
          # LENGUAJES: PAT fine-grained de SOLO LECTURA (Metadata + Contents: read),
          #   acotado a los repos que quieras contar. Un fine-grained tiene UN solo
          #   resource owner: pon varios separados por coma (tu cuenta y cada org).
          # NO usar un PAT clásico con scope `repo`: es lectura Y ESCRITURA sobre
          #   todos los repos privados de las orgs. No existe `repo` de solo lectura.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_TOKEN_REPOS: ${{ secrets.METRICS_TOKEN_REPOS }}
          # Correos con que has firmado commits, separados por coma. En un secret:
          # incluye correos corporativos que no deben quedar en un repo público.
          METRICS_EMAILS: ${{ secrets.METRICS_EMAILS }}
        run: python3 .github/workflows/metrics.py

      # Se salta si el paso anterior falló (default `if: success()`): mejor un README
      # con datos de ayer que uno a medio escribir.
      - name: Commit si cambió
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: actualizar métricas"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          done
          exit 1

      # Un run rojo queda enterrado en la pestaña Actions. Un issue llega por correo
      # y se ve. Importa porque el fallo encadena: sin commits, GitHub apaga el cron
      # a los 60 días de inactividad y ya no se recupera solo.
      - name: Abrir un issue si falló
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITULO: "Las métricas del perfil dejaron de actualizarse"
        run: |
          # Uno solo, no uno por día.
          abiertos=$(gh issue list --state open --search "in:title \"$TITULO\"" --json number --jq 'length')
          [ "$abiertos" -gt 0 ] && exit 0
          gh issue create --title "$TITULO" --body "El workflow \`metrics\` falló.

          Causas típicas, en orden de frecuencia:
          - \`METRICS_TOKEN\` o \`METRICS_TOKEN_REPOS\` revocado, expirado o regenerado
            (editar la expiración de un PAT clásico **cambia su valor**).
          - Una organización volvió a restringir los PAT clásicos.
          - Al token de repos le falta \`read:org\`: sin él \`viewer.organizations\`
            devuelve vacío y el bloque sale con los repos personales nada más.

          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Mientras esto siga fallando el README no se actualiza, y a los 60 días sin
          commits GitHub deshabilita el cron."
